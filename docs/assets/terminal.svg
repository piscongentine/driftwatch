<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 441" role="img" aria-labelledby="t d">
<title id="t">DriftWatch in a terminal</title>
<desc id="d">Animated terminal: make data, make train, make live and make drift run one after another, ending with a drift alert. The text is real output.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;white-space:pre}
.cmd{fill:#f2f4ff;font-weight:700}.out{fill:#c6ccf0}.bad{fill:#ff8f88}.p{fill:#8b9cff}
.l{opacity:0;animation:show 12.5s linear infinite}
@keyframes show{0%{opacity:0}1.5%{opacity:1}88%{opacity:1}94%,100%{opacity:0}}
.cur{fill:#8b9cff;animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.cur{animation:none}}</style>
<rect width="920" height="441" rx="14" fill="#0e1120"/><rect width="920" height="38" rx="14" fill="#171c33"/><rect y="24" width="920" height="14" fill="#171c33"/>
<circle cx="24" cy="19" r="6" fill="#ff8f88"/><circle cx="46" cy="19" r="6" fill="#f3bd55"/><circle cx="68" cy="19" r="6" fill="#5fd68a"/>
<text x="460" y="24" text-anchor="middle" fill="#9aa3d0" style="font-size:13px">driftwatch</text>
<text class="l cmd" x="24" y="62" style="animation-delay:0.0s"><tspan class="p">$ </tspan>make data</text>
<text class="l out" x="24" y="85" style="animation-delay:0.5s">history : 4001 rows, 40 machines x 100 hours, plus 1 duplicate reading</text>
<text class="l out" x="24" y="108" style="animation-delay:1.0s">plan    : 12 live batches, sizes [40, 40, 40, 4, 40, 40, 40, 0, 40, 40, 40, 40], drift starts at batch 4</text>
<text class="l cmd" x="24" y="131" style="animation-delay:1.5s"><tspan class="p">$ </tspan>make train</text>
<text class="l out" x="24" y="154" style="animation-delay:2.0s">features : 4001 rows back from Feast (rows lost: 0)</text>
<text class="l out" x="24" y="177" style="animation-delay:2.5s">holdout  : accuracy 0.96 (never-fails baseline 0.932), precision 0.726, recall 0.662, F1 0.692, AUC 0.967</text>
<text class="l cmd" x="24" y="200" style="animation-delay:3.0s"><tspan class="p">$ </tspan>make live</text>
<text class="l out" x="24" y="223" style="animation-delay:3.5s">batch  7  rows   0  drift 4  pushed   0  online order ok</text>
<text class="l out" x="24" y="246" style="animation-delay:4.0s">batch 11  rows  40  drift 8  pushed  40  online order ok</text>
<text class="l cmd" x="24" y="269" style="animation-delay:4.5s"><tspan class="p">$ </tspan>make drift</text>
<text class="l out" x="24" y="292" style="animation-delay:5.0s">batch  0  rows  40  share 0.00  gate SUCCESS</text>
<text class="l out" x="24" y="315" style="animation-delay:5.5s">batch  7  rows   0  empty</text>
<text class="l out" x="24" y="338" style="animation-delay:6.0s">batch 11  rows  40  share 0.83  gate FAIL</text>
<text class="l out" x="24" y="361" style="animation-delay:6.5s">detection: {&#x27;precision&#x27;: 1.0, &#x27;recall&#x27;: 1.0, &#x27;false_alarms&#x27;: [], &#x27;missed&#x27;: []}</text>
<text class="l bad" x="24" y="384" style="animation-delay:7.0s">ALERT  Batch 11: 5 of 6 columns drifted  (temperature, vibration, humidity, mode, prediction)</text>
<rect class="cur" x="24" y="395" width="9" height="16"/>
</svg>